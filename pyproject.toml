[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docqa"
version = "0.1.0"
description = "Local AI Document Assistant POC: LangGraph + MCP + Pydantic + Ollama"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=2.0",
    "mcp>=2.2,<3",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4",
    "ollama>=0.5",
    "numpy>=1.26",
    "pypdf>=5.0",
    "typer>=0.12",
    "rich>=13.0",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
docqa = "docqa.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "ollama: tests that need a running Ollama server with the configured models (skipped otherwise)",
]
